[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-oracle"
version = "0.1.0"
description = "Local global-stock research and paper-trading tool"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8,<2",
    "ddgs>=9.16,<10",
    "fastapi>=0.110",
    "httpx>=0.27",
    "tomlkit>=0.13,<1",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
]

[project.scripts]
oracle = "oracle.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# On a GPU, install torch from the PyTorch index first (an RTX 50 card needs a cu128 build):
# pip install torch --index-url https://download.pytorch.org/whl/cu128
laya = ["laya>=0.3.22,<0.4"]

[tool.setuptools.packages.find]
include = ["oracle*", "holiday_watch"]

[tool.setuptools.package-data]
"oracle.gui" = ["static/*", "static/*/*"]
"holiday_watch" = ["*.md", "*.txt", "*.ps1", "config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not network and not laya'"
markers = ["network: hits real third-party services; run with -m network",
           "laya: loads the real Laya model (GPU or CPU, a 1.3 GB download once); run with -m laya",
           "frozen_lines: runs with every frozen paper line frozen (by default only regime-ai is)"]
