<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Oracle</title>
<style>
:root {
  --bg: #0e1116; --bg-raised: #161b22; --bg-inset: #0a0d12; --border: #262d36;
  --text: #d7dde5; --text-dim: #8b949e; --accent: #4c8dff;
  --up: #3fb950; --down: #f85149; --warn: #d29922;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
header { display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: center; padding: 8px 16px;
  background: var(--bg-raised); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0 16px 0 0; }
#app-controls { margin: 0 0 0 auto; }
.dim { color: var(--text-dim); }
.layout { display: flex; min-height: calc(100vh - 44px); }
nav { width: 160px; background: var(--bg-inset); border-right: 1px solid var(--border); padding: 8px 0; }
.tab-btn { display: block; width: 100%; text-align: left; padding: 8px 16px; background: none; border: 0;
  border-left: 3px solid transparent; color: var(--text-dim); font: inherit; cursor: pointer; }
.tab-btn:hover, .tab-btn:focus-visible { color: var(--text); }
.tab-btn.active { color: var(--text); background: var(--bg-raised); border-left-color: var(--accent); }
main { flex: 1; padding: 16px; overflow: auto; }
#error-banner { display: flex; gap: 12px; align-items: center; padding: 8px 16px;
  background: #3a1417; border-bottom: 1px solid var(--down); }
#error-banner[hidden] { display: none; }
#error-close { margin-left: auto; background: none; border: 0; color: var(--text); cursor: pointer; font-size: 16px; }
details { margin-top: 24px; }
table { border-collapse: collapse; }
th, td { padding: 4px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; }
td.num { text-align: right; font-family: var(--mono); }
tr.state-paused td:nth-child(2) { color: var(--down); }
tr.state-waiting td:nth-child(2) { color: var(--warn); }
.figures { display: flex; flex-wrap: wrap; }
.figures > span { margin-right: 12px; white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
input, select, button { font: inherit; color: var(--text); background: var(--bg-inset);
  border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
button { cursor: pointer; background: var(--bg-raised); }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; margin: 1px 4px 1px 0; padding: 0 6px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 12px; background: var(--bg-raised); }
.chip button { border: 0; padding: 0 2px; background: none; color: var(--text-dim); }
.tag-input { width: 64px; padding: 0 4px; font-size: 12px; }
.mono { font-family: var(--mono); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
table.results td { vertical-align: middle; }
tr.delisted td { color: var(--text-dim); }
th.num { text-align: right; }
.up { color: var(--up); }
.warn-text { color: var(--warn); }
.down { color: var(--down); }
.faded { opacity: 0.45; }
.small { font-size: 12px; }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px;
  font-size: 11px; color: var(--text-dim); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.sigs { min-width: 190px; max-width: 240px; }
td.name { max-width: 180px; }
.sig { display: inline-block; margin-right: 8px; font-size: 12px; white-space: nowrap; }
.sig.bullish { color: var(--up); }
.sig.bearish { color: var(--down); }
.card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px;
  margin-bottom: 12px; }
.cards .card { flex: 1; min-width: 220px; margin-bottom: 0; }
.cards { margin-bottom: 12px; align-items: stretch; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 20px 0 8px; color: var(--text-dim); font-weight: 600; }
.big { font-size: 22px; font-family: var(--mono); }
.summary { max-width: 80ch; margin-top: 20px; }
.peers .chip { margin-bottom: 4px; }
.ledgers { align-items: flex-start; gap: 16px; }
.ledger { flex: 1 1 400px; min-width: 0; }
.metrics td:first-child { padding-left: 0; }
.equity-chart { margin: 8px 0; }
.trade { margin: 12px 0; padding-top: 8px; border-top: 1px solid var(--border); }
.form-note { font-size: 12px; color: var(--text-dim); min-height: 1em; }
.small-btn { padding: 0 6px; font-size: 12px; }
#c-research h3 { margin: 0; }
#c-research .cards { margin: 12px 0; }
#c-research details { margin-top: 12px; }
.observation { margin: 4px 0 10px; padding: 6px 8px; background: var(--bg-inset); border: 1px solid var(--border);
  border-radius: 4px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.result { margin: 8px 0; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.tip-wrap { white-space: nowrap; }
.tip { position: relative; display: inline-block; margin-left: 4px; width: 15px; height: 15px; border-radius: 50%;
  border: 1px solid var(--text-dim); color: var(--text-dim); font-size: 10px; line-height: 13px; text-align: center;
  cursor: help; }
.tip:hover::after, .tip:focus::after { content: attr(data-tip); position: absolute; left: 20px; top: -4px; z-index: 10;
  width: 280px; padding: 8px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 12px; line-height: 1.4; font-weight: 400; text-align: left; white-space: normal;
  pointer-events: none; }
.tip.tip-left:hover::after, .tip.tip-left:focus::after { left: auto; right: 20px; }
</style>
</head>
<body>
<header>
  <h1>Market Oracle</h1>
  <span id="universe-state" class="dim">Universe ...</span>
  <span id="tick-state" class="dim"></span>
  <span id="sources-state" class="dim"></span>
  <span id="app-controls" class="row"></span>
</header>
<div id="error-banner" hidden role="alert"><span id="error-msg"></span>
  <button id="error-close" type="button" aria-label="Dismiss">&times;</button></div>
<div class="layout">
  <nav><div id="tab-list"></div></nav>
  <main>
    <div id="main-pane"></div>
    <details open>
      <summary id="tick-summary" class="dim">Ticks</summary>
      <div id="tick-controls" class="row"></div>
      <div id="tick-last"></div>
    </details>
    <details>
      <summary class="dim">App</summary>
      <div id="app-settings"></div>
    </details>
    <details>
      <summary class="dim">Data sources</summary>
      <table><thead id="sources-head"></thead><tbody id="sources-body"></tbody></table>
    </details>
  </main>
</div>
<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
