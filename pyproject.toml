[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-oracle"
version = "0.1.0"
description = "Local global-stock research and paper-trading tool"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16,<10",
    "fastapi>=0.110",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
]

[project.scripts]
oracle = "oracle.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.setuptools.package-data]
"oracle.gui" = ["static/*", "static/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = ["network: hits real third-party services; run with -m network"]
